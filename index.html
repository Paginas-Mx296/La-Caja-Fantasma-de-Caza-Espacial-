<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego para Gatos: La Caja Fantasma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .wood-pattern {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="wood-pattern text-slate-100 h-screen w-screen flex flex-col justify-between items-center select-none overflow-hidden">

    <!-- Header Controls -->
    <header class="w-full max-w-4xl px-4 py-3 flex justify-between items-center z-10 bg-slate-900/80 backdrop-blur-md rounded-b-2xl border-b border-slate-700/50 shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">📦</span>
            <div>
                <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                    La Caja Fantasma
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">¡Toca la pantalla o deja que tu gato atrapa las presas!</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Score Counter -->
            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-2">
                <span class="text-amber-400 font-bold text-sm">Premios:</span>
                <span id="scoreText" class="text-lg font-extrabold text-white">0</span>
            </div>

            <!-- Mode Selector -->
            <select id="targetSelect" class="bg-slate-800 text-slate-200 text-xs md:text-sm font-semibold px-3 py-2 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
                <option value="mouse">🐭 Ratón</option>
                <option value="feather">🪶 Pluma</option>
                <option value="laser">🔴 Láser</option>
                <option value="kibble">🥩 Premio</option>
            </select>

            <!-- Sound Toggle -->
            <button id="soundBtn" class="bg-slate-800 p-2 rounded-xl border border-slate-700 hover:bg-slate-700 transition">
                <span id="soundIcon" class="text-lg">🔊</span>
            </button>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="relative flex-1 w-full flex justify-center items-center p-2 sm:p-4">
        <div id="canvasContainer" class="relative w-full h-full max-w-4xl max-h-[80vh] bg-amber-950/20 rounded-3xl border-2 border-amber-900/40 shadow-2xl overflow-hidden flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>
            
            <!-- Tap Hint Overlay (Disappears on first tap) -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm flex flex-col justify-center items-center text-center p-6 transition-opacity duration-300">
                <div class="text-6xl mb-4 animate-bounce">🐾</div>
                <h2 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">¡Pon el juego para tu gato!</h2>
                <p class="text-slate-300 max-w-md text-sm md:text-base mb-6">Toca en cualquier parte para iniciar. Las presas saldrán aleatoriamente de las agujeros de la caja.</p>
                <button id="startBtn" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-600 font-bold text-slate-900 text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition">
                    ¡Empieza a Jugar!
                </button>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-4xl px-4 py-2 mb-2 flex justify-between items-center text-xs text-slate-400">
        <div class="flex items-center space-x-2">
            <span>Dificultad:</span>
            <button id="speedBtn" class="bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-amber-400 font-semibold hover:bg-slate-700">
                Normal
            </button>
        </div>
        <button id="resetScoreBtn" class="hover:text-slate-200 underline">Reiniciar Puntos</button>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const scoreText = document.getElementById('scoreText');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const targetSelect = document.getElementById('targetSelect');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const speedBtn = document.getElementById('speedBtn');
        const resetScoreBtn = document.getElementById('resetScoreBtn');

        let score = 0;
        let soundEnabled = true;
        let gameStarted = false;
        let speedMode = 1; // 0: Lento, 1: Normal, 2: Rápido
        const speedLabels = ['Tranquilo', 'Normal', 'Frenético'];
        const speedMultipliers = [0.6, 1.0, 1.6];

        // Audio Context Synthesizer (No external audio files needed!)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'catch') {
                // Happy squeak / pop
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'peek') {
                // Subtle rustle / peek sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            generateHoles();
        }

        window.addEventListener('resize', resizeCanvas);

        let holes = [];
        let targets = [];
        let particles = [];

        class Hole {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
            }

            draw() {
                // Hole Outer Bezel
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                ctx.fillStyle = '#78350f';
                ctx.fill();

                // Hole Interior (Dark)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#1c0d02';
                ctx.fill();

                // Inner Shadow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 6;
                ctx.stroke();
            }
        }

        class Target {
            constructor(hole) {
                this.hole = hole;
                this.type = targetSelect.value;
                this.progress = 0; // 0 (hidden) -> 1 (fully out) -> 0 (hidden)
                this.state = 'emerging'; // emerging, waiting, hiding, caught
                this.holdTime = 0;
                this.maxHoldTime = (Math.random() * 80 + 40) / speedMultipliers[speedMode];
                this.speed = (0.03 + Math.random() * 0.02) * speedMultipliers[speedMode];
                playSound('peek');
            }

            update() {
                if (this.state === 'emerging') {
                    this.progress += this.speed;
                    if (this.progress >= 1) {
                        this.progress = 1;
                        this.state = 'waiting';
                    }
                } else if (this.state === 'waiting') {
                    this.holdTime++;
                    if (this.holdTime >= this.maxHoldTime) {
                        this.state = 'hiding';
                    }
                } else if (this.state === 'hiding') {
                    this.progress -= this.speed * 1.2;
                    if (this.progress <= 0) {
                        this.progress = 0;
                        return false; // remove
                    }
                } else if (this.state === 'caught') {
                    return false; // remove
                }
                return true;
            }

            draw() {
                if (this.progress <= 0) return;

                // Calculate position emerging from hole
                const offsetY = (1 - this.progress) * (this.hole.radius * 1.2);
                const currentX = this.hole.x;
                const currentY = this.hole.y - (this.hole.radius * 0.3) + offsetY;

                ctx.save();

                // Clip drawing inside the hole area plus emerging upward region
                ctx.beginPath();
                ctx.rect(
                    this.hole.x - this.hole.radius * 1.5,
                    this.hole.y - this.hole.radius * 2,
                    this.hole.radius * 3,
                    this.hole.radius * 2.1
                );
                ctx.clip();

                this.drawEntity(currentX, currentY);

                ctx.restore();
            }

            drawEntity(x, y) {
                const scale = this.hole.radius / 35;

                if (this.type === 'mouse') {
                    // Mouse Ears
                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.arc(x - 12 * scale, y - 10 * scale, 8 * scale, 0, Math.PI * 2);
                    ctx.arc(x + 12 * scale, y - 10 * scale, 8 * scale, 0, Math.PI * 2);
                    ctx.fill();

                    // Mouse Body/Head
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(x, y, 16 * scale, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(x - 6 * scale, y - 3 * scale, 2.5 * scale, 0, Math.PI * 2);
                    ctx.arc(x + 6 * scale, y - 3 * scale, 2.5 * scale, 0, Math.PI * 2);
                    ctx.fill();

                    // Nose
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(x, y + 5 * scale, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();

                    // Whiskers
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x - 5 * scale, y + 5 * scale); ctx.lineTo(x - 20 * scale, y + 2 * scale);
                    ctx.moveTo(x - 5 * scale, y + 7 * scale); ctx.lineTo(x - 18 * scale, y + 10 * scale);
                    ctx.moveTo(x + 5 * scale, y + 5 * scale); ctx.lineTo(x + 20 * scale, y + 2 * scale);
                    ctx.moveTo(x + 5 * scale, y + 7 * scale); ctx.lineTo(x + 18 * scale, y + 10 * scale);
                    ctx.stroke();

                } else if (this.type === 'feather') {
                    // Feather Shaft & Feathers
                    const colors = ['#ec4899', '#8b5cf6', '#3b82f6'];
                    colors.forEach((color, i) => {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.ellipse(
                            x + (i - 1) * 8 * scale,
                            y - 5 * scale,
                            6 * scale,
                            20 * scale,
                            (i - 1) * 0.3,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                    });
                } else if (this.type === 'laser') {
                    // Glowing Red Dot
                    const gradient = ctx.createRadialGradient(x, y, 2, x, y, 18 * scale);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.3, '#ef4444');
                    gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, 18 * scale, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'kibble') {
                    // Fish Shaped Kibble / Snack
                    ctx.fillStyle = '#d97706';
                    ctx.beginPath();
                    ctx.ellipse(x, y, 14 * scale, 9 * scale, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(x + 10 * scale, y);
                    ctx.lineTo(x + 18 * scale, y - 7 * scale);
                    ctx.lineTo(x + 18 * scale, y + 7 * scale);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            isHit(touchX, touchY) {
                const currentY = this.hole.y - (this.hole.radius * 0.3) + ((1 - this.progress) * (this.hole.radius * 1.2));
                const dist = Math.hypot(touchX - this.hole.x, touchY - currentY);
                return dist < this.hole.radius * 1.2 && this.progress > 0.2;
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 6 + 4;
                this.color = ['#fbbf24', '#f59e0b', '#f43f5e', '#60a5fa'][Math.floor(Math.random() * 4)];
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.04;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function generateHoles() {
            holes = [];
            targets = [];
            const cols = width < 500 ? 2 : 3;
            const rows = 3;
            const radius = Math.min(width / (cols * 3.5), height / (rows * 3.5));

            const paddingX = width / (cols + 1);
            const paddingY = height / (rows + 1);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = paddingX * (c + 1);
                    const y = paddingY * (r + 1);
                    holes.push(new Hole(x, y, radius));
                }
            }
        }

        let spawnTimer = 0;

        function animate() {
            // Draw Box Texture / Background
            ctx.fillStyle = '#b45309';
            ctx.fillRect(0, 0, width, height);

            // Cardboard subtle lines
            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 2;
            for (let y = 0; y < height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Draw Box Holes
            holes.forEach(hole => hole.draw());

            // Spawn Logic
            spawnTimer++;
            const spawnInterval = Math.max(30, 90 / speedMultipliers[speedMode]);
            if (spawnTimer > spawnInterval) {
                spawnTimer = 0;
                if (targets.length < 2) {
                    const availableHoles = holes.filter(h => !targets.some(t => t.hole === h));
                    if (availableHoles.length > 0) {
                        const randomHole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
                        targets.push(new Target(randomHole));
                    }
                }
            }

            // Update & Draw Targets
            targets = targets.filter(target => {
                const active = target.update();
                if (active) target.draw();
                return active;
            });

            // Update & Draw Particles
            particles = particles.filter(particle => {
                const active = particle.update();
                if (active) particle.draw();
                return active;
            });

            requestAnimationFrame(animate);
        }

        function handleInteraction(evt) {
            evt.preventDefault();
            if (!gameStarted) return;

            const rect = canvas.getBoundingClientRect();
            const touches = evt.changedTouches ? evt.changedTouches : [evt];

            for (let i = 0; i < touches.length; i++) {
                const touchX = touches[i].clientX - rect.left;
                const touchY = touches[i].clientY - rect.top;

                targets.forEach(target => {
                    if (target.state !== 'caught' && target.isHit(touchX, touchY)) {
                        target.state = 'caught';
                        score++;
                        scoreText.innerText = score;
                        playSound('catch');

                        // Spawn particles
                        for (let p = 0; p < 12; p++) {
                            particles.push(new Particle(touchX, touchY));
                        }
                    }
                });
            }
        }

        canvas.addEventListener('touchstart', handleInteraction, { passive: false });
        canvas.addEventListener('mousedown', handleInteraction);

        startBtn.addEventListener('click', () => {
            startOverlay.classList.add('opacity-0', 'pointer-events-none');
            gameStarted = true;
            if (!audioCtx) audioCtx = new AudioCtx();
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.innerText = soundEnabled ? '🔊' : '🔇';
        });

        speedBtn.addEventListener('click', () => {
            speedMode = (speedMode + 1) % 3;
            speedBtn.innerText = speedLabels[speedMode];
        });

        resetScoreBtn.addEventListener('click', () => {
            score = 0;
            scoreText.innerText = '0';
        });

        // Initialize Canvas and Start Loop
        window.onload = () => {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
